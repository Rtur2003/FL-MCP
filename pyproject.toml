[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fl-mcp"
dynamic = ["version"]
description = "MCP server for FL Studio: transport, mixer, channels, patterns, step sequencer and piano roll."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hasan Arthur Altuntaş" }]
keywords = ["mcp", "model-context-protocol", "fl-studio", "midi", "daw"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "mido>=1.3.3,<2",
    "python-rtmidi>=1.5.8,<2",
]

[project.optional-dependencies]
audio = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]
service = ["fastapi>=0.115", "uvicorn>=0.30"]
app = ["pywebview>=5.3"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fl-studio-api-stubs>=37",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.scripts]
fl-mcp = "fl_mcp.cli:main"

[project.gui-scripts]
fl-mcp-studio = "fl_mcp.app:main"

[project.urls]
Homepage = "https://github.com/Rtur2003/FL-MCP"

[tool.hatch.version]
path = "src/fl_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["service"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "service", "."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fl_mcp/fl/*" = ["UP", "B007", "B905"]  # must run on FL Studio's older embedded Python
