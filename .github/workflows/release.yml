name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name if triggered manually"
        required: false

permissions:
  contents: write

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,audio]"

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          python scripts/build_plugin.py --check
          pytest

      - name: Build universal release bundles
        run: python packaging/build_release.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: universal-dists
          path: dist/*

  build-native-apps:
    name: Native App (${{ matrix.os_label }}-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_label: windows
            arch_label: x86_64
          - runner: windows-11-arm
            os_label: windows
            arch_label: arm64
          - runner: macos-latest
            os_label: macos
            arch_label: arm64
          - runner: macos-15-intel
            os_label: macos
            arch_label: x86_64
          - runner: ubuntu-latest
            os_label: linux
            arch_label: x86_64
          - runner: ubuntu-24.04-arm
            os_label: linux
            arch_label: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio & Tk dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-dev python3-tk

      - name: Setup MSVC ARM64 toolchain
        if: matrix.os_label == 'windows' && matrix.arch_label == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - uses: astral-sh/setup-uv@v5

      - name: Install FL-MCP runtime + PyInstaller
        run: |
          uv venv --python 3.12
          uv pip install -e . "pyinstaller>=6.10"

      - name: Build native Desktop App archive
        run: |
          uv run --no-sync python packaging/build_app.py --os ${{ matrix.os_label }} --arch ${{ matrix.arch_label }} --out dist-app

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os_label }}-${{ matrix.arch_label }}
          path: dist-app/*

  publish-release:
    needs: [build-universal, build-native-apps]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Recompute unified SHA256SUMS.txt
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum *.whl *.tar.gz *.mcpb *.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
            release-assets/*.mcpb
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
