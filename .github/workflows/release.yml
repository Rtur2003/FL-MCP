name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name if triggered manually"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,audio]"

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          python scripts/build_plugin.py --check
          pytest

      - name: Build release packages
        run: python packaging/build_release.py --out dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/*.zip
            dist/SHA256SUMS.txt

